<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>链藏 · 贴链接</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { color: #c00000; margin-bottom: 4px; }
    .sub { color: #888; font-size: 14px; margin-top: 0; }
    form { display: flex; gap: 8px; margin-top: 16px; }
    #url { flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #c00000; color: #fff; border: 0; border-radius: 6px; padding: 9px 22px; cursor: pointer; font-size: 14px; }
    button:disabled { background: #999; cursor: wait; }
    #status { color: #666; min-height: 1.5em; font-size: 14px; }
    .err { color: #c00000; }
    .card { border: 1px solid #e8d8d8; border-left: 4px solid #c00000; border-radius: 8px; padding: 16px 20px; margin-top: 12px; }
    .meta { color: #888; font-size: 13px; }
    .card h2 { font-size: 18px; margin: 6px 0 8px; }
    .sec { margin-top: 14px; }
    .sec > b { color: #c00000; font-size: 14px; }
    .sec p { margin: 6px 0 0; }
    ul { margin: 6px 0 0; padding-left: 20px; }
    li { margin: 4px 0; }
    .quote { border-left: 3px solid #c00000; margin: 8px 0 0; padding: 5px 10px; color: #444; font-style: italic; background: #faf5f5; border-radius: 0 4px 4px 0; }
    .quote .tag { font-style: normal; font-size: 12px; margin-right: 6px; }
    .quote.ok { border-left-color: #2e7d32; }
    .quote.ok .tag { color: #2e7d32; }
    .quote.bad { border-left-color: #c00000; background: #fdeaea; }
    .quote.bad .tag { color: #c00000; font-weight: bold; }
    .obs { margin-top: 14px; font-size: 12px; color: #999; border-top: 1px dashed #ddd; padding-top: 8px; line-height: 1.7; }
    .exp { margin-top: 14px; background: #fff; color: #c00000; border: 1px solid #c00000; border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
    .exp:hover { background: #c00000; color: #fff; }
    .exp:disabled { opacity: .6; cursor: wait; }
    #hist { margin-top: 28px; }
    #qa { margin-top: 28px; }
    #qa form { display: flex; gap: 8px; margin-top: 8px; }
    #q { flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    #qout .ans { border: 1px solid #e8d8d8; border-left: 4px solid #c00000; border-radius: 8px; padding: 14px 18px; margin-top: 12px; white-space: pre-wrap; line-height: 1.8; font-size: 14px; }
    #qout .ans.degraded { border-left-color: #999; color: #777; background: #fafafa; }
    #qout .src { margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 8px; font-size: 13px; }
    #qout .src > div { margin: 5px 0; color: #555; }
    #qout .cite { color: #c00000; font-weight: bold; }
    .h-item { border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; margin-top: 8px; cursor: pointer; }
    .h-item:hover { border-color: #c00000; }
    .h-item .t { font-weight: bold; }
    .h-item .s { color: #888; font-size: 13px; margin-top: 2px; }

  </style>
</head>
<body>
  <h1>链藏</h1>
  <p class="sub">贴一个链接 → 自动抓取 → LLM 结构化（V1 · 在线版）</p>
  <form id="f">
    <input id="url" type="text" placeholder="粘贴微信公众号文章链接">
    <button id="btn" type="submit">收录</button>
  </form>
  <p id="status"></p>
  <div id="out"></div>
  <div id="qa">
    <h2 style="font-size:16px;color:#c00000;">🔍 问一问（基于已收藏的内容）</h2>
    <form id="qf">
      <input id="q" type="text" placeholder="例如：Embedding 和关键词搜索有什么区别？">
      <button id="qbtn" type="submit">提问</button>
    </form>
    <p id="qstatus"></p>
    <div id="qout"></div>
  </div>
  <div id="hist"><h2 style="font-size:16px;color:#c00000;">📚 收藏历史</h2><div id="hist-list"></div></div>

  <script>
    const $ = (id) => document.getElementById(id);

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btn');
      $('status').textContent = '抓取并结构化中……（首次抓取 + 模型调用，约 10–60 秒）';
      btn.disabled = true;
      $('out').innerHTML = '';
      try {
        const r = await fetch('/api/structure', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: $('url').value }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
        render(data);
        loadHistory(); // D6：新收录成功后目录卡片盒立即刷新
        $('status').textContent = '✅ 完成';
      } catch (err) {
        $('status').innerHTML = '<span class="err">❌ ' + esc(err.message) + '</span>';
      } finally {
        btn.disabled = false;
      }
    });

        // D6：点历史条目 → 直读全量档案复用 render 画卡（不调模型、零 token）
        async function showCard(hash) {
      $('status').textContent = '读取历史档案……';
      try {
        const r = await fetch('/api/card/' + hash);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
        render({
          card: d.card,
          quotesCheck: d.quotesCheck,
          meta: {
            url: d.url, hash: d.hash, title: d.title, account: d.account,
            publishTime: d.publishTime, fromCache: true, finishReason: 'history（直读档案，未调模型）',
          },
        });
        $('status').textContent = '✅ 历史档案';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        $('status').innerHTML = '<span class="err">❌ ' + esc(err.message) + '</span>';
      }
    }

    // D6：页面打开就拉目录卡片盒
    async function loadHistory() {
      const box = $('hist-list');
      try {
        const r = await fetch('/api/history');
        const list = await r.json();
        box.innerHTML = (Array.isArray(list) && list.length)
          ? list.map((x) =>
              '<div class="h-item" data-hash="' + esc(x.hash) + '">' +
                '<div class="t">' + esc(x.title) + '</div>' +
                '<div class="s">' + esc(x.account || '') + ' · ' + esc((x.savedAt || '').slice(0, 10)) + ' · ' + esc(x.summary || '') + '</div>' +
              '</div>').join('')
          : '<p class="meta">（还没有收藏）</p>';
      } catch {
        box.innerHTML = '<p class="meta">历史加载失败</p>';
      }
    }
    $('hist-list').addEventListener('click', (e) => {
      const item = e.target.closest('.h-item');
      if (item) showCard(item.dataset.hash);
    });
    loadHistory();

    // D4（S3）：问一问 —— 提问 → 后端双路检索 + 带出处作答
    $('qf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = $('q').value.trim();
      if (!q) return;
      const btn = $('qbtn');
      btn.disabled = true;
      $('qstatus').textContent = '检索并作答中……（约 2–5 秒）';
      $('qout').innerHTML = '';
      try {
        const r = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
        renderAnswer(d);
        $('qstatus').textContent = d.degraded ? '⛔ 语料里没有相关内容' : '✅ 完成';
      } catch (err) {
        $('qstatus').innerHTML = '<span class="err">❌ ' + esc(err.message) + '</span>';
      } finally {
        btn.disabled = false;
      }
    });

    // 出处展示：正文里 [n] 渲染成角标 + 底部来源列表 + 溯源校验告警
    function renderAnswer(d) {
      const body = esc(d.answer).replace(/\[(\d+)\]/g, (m, n) => '<span class="cite">[' + n + ']</span>');
      let html = '<div class="ans' + (d.degraded ? ' degraded' : '') + '">' + body + '</div>';
      if (Array.isArray(d.sources) && d.sources.length) {
        html += '<div class="src"><b>来源</b>' + d.sources.map((s) =>
          '<div>[' + s.n + '] ' + esc(s.title) + ' — ' + esc(s.account) + ' · ' + esc(s.publish) +
          '（v=' + (s.vscore === null ? '-' : s.vscore.toFixed(3)) + ' k=' + (s.kscore === null ? '-' : s.kscore.toFixed(3)) + '）</div>'
        ).join('') + '</div>';
      }
      if (d.check && Array.isArray(d.check.invalid) && d.check.invalid.length) {
        html += '<p class="err">⚠️ 溯源校验：模型引用了不存在的来源 [' + d.check.invalid.join(',') + ']</p>';
      }
      if (d.check && d.check.noCitation) {
        html += '<p class="err">⚠️ 模型认为资料不足以直接回答（未标注来源）</p>';
      }
      $('qout').innerHTML = html;
    }

    // D1（S3）：导出当前卡片到 Obsidian vault（本地功能；云端会返回「仅本地可用」）
    $('out').addEventListener('click', async (e) => {
      const btn = e.target.closest('.exp');
      if (!btn || btn.disabled) return;
      const hash = btn.dataset.hash;
      if (!hash) return;
      const old = btn.textContent;
      btn.disabled = true;
      btn.textContent = '导出中……';
      try {
        const r = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hash }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
        btn.textContent = '✅ 已导出';
        $('status').textContent = '✅ 已导出到 Obsidian：' + d.filePath;
      } catch (err) {
        btn.textContent = old;
        $('status').innerHTML = '<span class="err">❌ 导出失败：' + esc(err.message) + '</span>';
      } finally {
        btn.disabled = false;
      }
    });

    // 防 XSS：所有进 HTML 的字符串先过一遍转义
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function render({ card, meta, quotesCheck }) {
      const m = meta || {};
      const u = m.usage || {};
      const list = (arr) => (Array.isArray(arr) && arr.length)
        ? '<ul>' + arr.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'
        : '<p class="meta">（空 —— 原文没有）</p>';
      // D5：核验状态做成用户可见的产品能力（✅已核验 / ❌模型改写）
      const qc = Array.isArray(quotesCheck) ? quotesCheck : [];
      const okCount = qc.filter((x) => x.verified).length;
      const quotes = qc.length
        ? '<p class="meta">核验结果：' + okCount + '/' + qc.length + ' 条逐字命中</p>' +
          qc.map((x) =>
            '<div class="quote ' + (x.verified ? 'ok' : 'bad') + '">' +
            '<span class="tag">' + (x.verified ? '✅ 已核验' : '❌ 模型改写') + '</span>「' + esc(x.quote) + '」</div>'
          ).join('')
        : '<p class="meta">（空 —— 原文没有合适的金句）</p>';

      $('out').innerHTML =
        '<div class="card">' +
          '<div class="meta">' + esc(m.account || '') + ' · ' + esc(m.publishTime || '') +
            ' · ' + (m.fromCache ? '⚡ 缓存命中' : '🌐 新抓取') + ' · 正文 ' + (m.textLength || 0) + ' 字</div>' +
          '<h2>' + esc(m.title || '') + '</h2>' +
          '<div class="sec"><b>一句话摘要</b><p>' + esc(card.summary || '未指定') + '</p></div>' +
          '<div class="sec"><b>核心观点</b>' + list(card.points) + '</div>' +
          '<div class="sec"><b>金句（逐字摘录）</b>' + quotes + '</div>' +
          '<div class="sec"><b>可执行要点</b>' + list(card.takeaways) + '</div>' +
          '<button class="exp" data-hash="' + esc(m.hash || '') + '">📤 导出到 Obsidian</button>' +
          '<div class="obs">可观测：finish_reason=' + esc(m.finishReason) +
            ' ｜ JSON 围栏=' + (m.jsonFenced ? '有 ⚠️' : '无') +
            ' ｜ tokens：prompt ' + (u.promptTokens ?? '-') + ' / completion ' + (u.completionTokens ?? '-') +
            ' / reasoning ' + (u.reasoningTokens ?? '-') + ' / 总 ' + (u.totalTokens ?? '-') +
            ' ｜ 耗时 ' + (m.elapsed ?? '-') + ' ms ｜ hash=' + esc(m.hash || '') + '</div>' +
        '</div>';
    }
  </script>
</body>
</html>
